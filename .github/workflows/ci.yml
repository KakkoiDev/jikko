name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Report vet debt
        if: always()
        continue-on-error: true
        run: go vet ./...
      - name: Report formatting drift
        if: always()
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::warning::gofmt drift exists in:"
            echo "$files"
          fi
