name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read\n  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Report canonical gofmt diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gofmt -w .
          if ! git diff --quiet; then
            {
              echo 'Canonical gofmt diff:'
              echo '\`\`\`diff'
              git diff
              echo '\`\`\`'
            } > /tmp/gofmt-comment.md
            gh pr comment 18 --body-file /tmp/gofmt-comment.md
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::gofmt drift in:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
