name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Canonicalize Go formatting on this branch
        run: |
          gofmt -w .
          if ! git diff --quiet; then
            git config user.name "Jikko CI"
            git config user.email "jikko-ci@local"
            git add .
            git commit -m "Apply gofmt"
            git push origin HEAD:agent-workspace-operations
          fi
      - name: Build
        run: go build ./...
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::gofmt drift in:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
