name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: WASM build
        run: GOOS=js GOARCH=wasm go build -o /tmp/jikko.wasm ./cmd/jikko-wasm
      - name: WASM tests
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/jikko-wasm
      - name: Browser dependencies
        working-directory: browser
        run: npm install --ignore-scripts --package-lock=false && npm run check && npm run build
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::gofmt drift in:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
